<header class="site-header">
  <div class="site-container header-inner">
    <a class="site-brand" href="{{ '/' | relative_url }}" aria-label="GZZ criterion home">
      <img src="{{ '/assets/GZZ_logo.png' | relative_url }}" width="48" height="48" alt="">
      <span><strong>GZZ criterion</strong><span class="brand-subtitle">Generalized Zhang–Zhu</span></span>
    </a>
    <button class="nav-toggle" type="button" aria-controls="site-navigation" aria-expanded="false" hidden><span class="nav-toggle-label">Menu</span><span class="menu-lines" aria-hidden="true"></span></button>
    <nav class="site-nav" id="site-navigation" aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}"{% if page.title == 'Home' %} aria-current="page"{% endif %}>Home</a>
      {% for item in site.data.settings.menu %}<a href="{{ item.url | relative_url }}"{% if page.url contains item.url %} aria-current="page"{% endif %}>{% if item.url == '/comments' %}Discussion{% else %}{{ item.name }}{% endif %}</a>{% endfor %}
    </nav>
  </div>
</header>
